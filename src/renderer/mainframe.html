<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'">
  <title>Capri — Mainframe</title>
  <link rel="stylesheet" href="styles/mainframe.css">
  <script type="module" src="js/mainframe.js"></script>
</head>
<body>
  <!-- the title bar, like her game's menus: her stats on the left, what runs her on the right, the tabs under -->
  <header class="top">
    <div class="stats" id="stats"></div>
    <h1 class="top__title">MAINFRAME</h1>
    <div class="build" id="build"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="frame">
    <main class="pane">
      <div class="pane__head" id="head"></div>
      <div class="cards" id="sections"></div>
    </main>
  </div>
  <footer class="bottom">
    <button class="hint" id="help" type="button"><span class="hint__key">?</span><span id="helpLabel"></span></button>
  </footer>
  <div class="tip" id="tip" hidden></div>
</body>
</html>
